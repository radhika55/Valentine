<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Be My Valentine 💖</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    body {
      height: 100vh;
      margin: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: "Arial", sans-serif;
      background: linear-gradient(135deg, #ff9a9e, #fad0c4);
      overflow: hidden;
    }

    .card {
      background: white;
      padding: 30px 20px;
      border-radius: 20px;
      text-align: center;
      box-shadow: 0 10px 25px rgba(0,0,0,0.15);
      max-width: 350px;
      width: 90%;
      position: relative;
    }

    h1 {
      margin-bottom: 25px;
      font-size: 1.5em;
    }

    .buttons {
      display: flex;
      justify-content: center;
      gap: 15px;
      flex-wrap: wrap;
      position: relative;
    }

    button {
      padding: 12px 25px;
      font-size: 18px;
      border: none;
      border-radius: 10px;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    #yes {
      background-color: #ff4d6d;
      color: white;
    }

    #yes:hover {
      box-shadow: 0 0 15px #ff4d6d, 0 0 30px #ff4d6d50;
      transform: scale(1.05);
    }

    #no {
      background-color: #adb5bd;
      color: white;
      position: absolute; /* moving around */
    }

    @media (max-width: 400px) {
      h1 { font-size: 1.3em; }
      button { font-size: 16px; padding: 10px 20px; }
    }

    .heart {
      position: absolute;
      color: #ff4d6d;
      font-size: 20px;
      animation: floatUp 2s linear forwards;
      pointer-events: none;
    }

    @keyframes floatUp {
      0% { opacity: 1; transform: translateY(0) scale(1); }
      100% { opacity: 0; transform: translateY(-150px) scale(1.5); }
    }
  </style>
</head>
<body>

  <div class="card">
    <h1>Will you be my Valentine, Hubby? 💘</h1>
    <div class="buttons">
      <button id="yes">Yes 💖</button>
      <button id="no">No ❌</button>
    </div>
  </div>

  <script>
    const noBtn = document.getElementById("no");
    const yesBtn = document.getElementById("yes");
    const buttonsDiv = document.querySelector(".buttons");

    // Place No button initially to the right of Yes
    noBtn.style.left = "auto";
    noBtn.style.right = "0";
    noBtn.style.top = "0";
    noBtn.style.position = "relative";

    // No button moves randomly inside the card when hovered (original working version)
    noBtn.addEventListener("mouseover", () => {
      const cardRect = buttonsDiv.getBoundingClientRect();
      const maxX = cardRect.width - noBtn.offsetWidth;
      const maxY = cardRect.height - noBtn.offsetHeight;

      const x = Math.random() * maxX;
      const y = Math.random() * maxY;

      noBtn.style.position = "absolute";
      noBtn.style.left = x + "px";
      noBtn.style.top = y + "px";
    });

    // Floating hearts function
    function createHeart() {
      const heart = document.createElement("div");
      heart.className = "heart";
      heart.style.left = Math.random() * window.innerWidth + "px";
      heart.style.fontSize = 15 + Math.random() * 20 + "px";
      heart.textContent = "💖";
      document.body.appendChild(heart);
      setTimeout(() => heart.remove(), 2000);
    }

    // Pop a little heart above Yes button on hover
    yesBtn.addEventListener("mouseover", () => {
      const heart = document.createElement("div");
      heart.className = "heart";
      const rect = yesBtn.getBoundingClientRect();
      heart.style.left = rect.left + rect.width / 2 + "px";
      heart.style.top = rect.top - 20 + "px";
      heart.style.fontSize = "20px";
      heart.textContent = "💖";
      document.body.appendChild(heart);
      setTimeout(() => heart.remove(), 1000);
    });

    // Yes button click: show message instantly + floating hearts
    yesBtn.addEventListener("click", () => {
      document.body.innerHTML = `
        <div style="
          display:flex;
          align-items:center;
          justify-content:center;
          height:100vh;
          font-family:Arial;
          background:linear-gradient(135deg,#ff9a9e,#fad0c4);
          text-align:center;
          padding:20px;
          overflow: hidden;
        ">
          <h1>Great choice, Kuku 😍💖<br>See you this Valentine’s 💌</h1>
        </div>
      `;

      // Floating hearts continuously
      setInterval(createHeart, 300);
    });
  </script>

</body>
</html>
